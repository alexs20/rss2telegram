name: ci

# Gatekeeper only: builds and smoke-tests, never pushes or publishes.
# Releases happen exclusively through release.yml on a v* tag.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: no secrets in tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # config.yml holds real bot tokens and is git-ignored, but a `git add -f`
      # or a bad .gitignore edit would publish them. Releases are public, so
      # fail loudly here instead. The example file's placeholders pass.
      - name: Check tracked files for telegram tokens
        run: |
          set -euo pipefail
          hits="$(git grep -nE 'bot_token:[[:space:]]*"[0-9]{6,}:[A-Za-z0-9_-]{30,}"' \
                  -- . ':!data/config.example.yml' || true)"
          if [ -n "$hits" ]; then
            echo "::error::a real-looking bot token is committed - rotate it and remove it"
            echo "$hits"
            exit 1
          fi
          echo "no bot tokens in tracked files"

      - name: Assert config.yml is not tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch data/config.yml >/dev/null 2>&1; then
            echo "::error::data/config.yml is tracked - it must stay git-ignored"
            exit 1
          fi
          echo "data/config.yml is not tracked"

  build:
    name: build and smoke test
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Syntax check
        run: |
          set -euo pipefail
          python3 -m py_compile rss2tg.py
          echo "rss2tg.py compiles"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: rss2tg:ci
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      # The same smoke test the release runs, so a broken image fails on the PR
      # rather than on the tag push.
      - name: Smoke test
        run: |
          set -euo pipefail
          mkdir -p .smoke
          cp data/config.example.yml .smoke/config.yml
          chmod 777 .smoke
          docker run --rm -v "$PWD/.smoke:/data" rss2tg:ci --check
          uid="$(docker run --rm --entrypoint id rss2tg:ci -u)"
          test "$uid" = "10001" || { echo "::error::image runs as uid $uid, expected 10001"; exit 1; }
          echo "ok: uid $uid, config validates"

      - name: Compose file is valid
        run: |
          set -euo pipefail
          docker compose -f docker-compose.release.yml config >/dev/null
          echo "docker-compose.release.yml parses"
