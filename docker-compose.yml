services:
  rss2tg:
    build:
      context: .
    image: rss2tg:latest
    container_name: rss2tg
    restart: unless-stopped
    user: "1026:100"
    environment:
      TZ: America/Edmonton
      LOG_LEVEL: INFO
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
